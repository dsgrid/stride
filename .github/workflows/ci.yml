name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  DEFAULT_PYTHON: "3.13"
  DEFAULT_OS: ubuntu-latest

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Test the oldest and newest supported Python versions, plus Windows.
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[dev]"
    - name: Setup SSH for private repo access
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.STRIDE_DATA_DEPLOY_KEY }}
    - name: Download test data
      shell: bash
      run: |
        STRIDE_DATA_REF=$(cat .stride-data-ref | tr -d '[:space:]')
        echo "Cloning stride-data at ref: $STRIDE_DATA_REF"
        git clone --branch "$STRIDE_DATA_REF" --single-branch git@github.com:dsgrid/stride-data.git /tmp/stride-data
        mkdir -p ~/.stride/data
        cp -r /tmp/stride-data/global ~/.stride/data/
        cp -r /tmp/stride-data/global-test ~/.stride/data/
    - name: Run pytest with coverage
      run: |
        pytest -v --cov --cov-report=xml
    - name: codecov
      uses: codecov/codecov-action@v5
      if: ${{ matrix.os == env.DEFAULT_OS && matrix.python-version == env.DEFAULT_PYTHON }}
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: dsgrid/stride
        fail_ci_if_error: false
        verbose: true
  mypy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[dev]"
        mypy
  ruff:
    runs-on: ubuntu-latest
    name: "ruff"
    steps:
      - uses: actions/checkout@v4
      - uses: chartboost/ruff-action@v1
        with:
          src: "./src"
